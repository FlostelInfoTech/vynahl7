[package]
name = "vyna-hl7"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/vyna-hl7"
keywords.workspace = true
categories.workspace = true
description = "Comprehensive HL7 v2.x library for Rust - parsing, validation, and MLLP support"

[features]
default = []
tls = ["vyna-hl7-mllp/tls"]
testing = ["vyna-hl7-mllp/testing", "vyna-hl7-http/testing"]

[dependencies]
vyna-hl7-core.workspace = true
vyna-hl7-parser.workspace = true
vyna-hl7-validator.workspace = true
vyna-hl7-terser.workspace = true
vyna-hl7-mllp.workspace = true
vyna-hl7-http.workspace = true

[[example]]
name = "mllp_tls_server"
required-features = ["tls"]

[[example]]
name = "mllp_tls_client"
required-features = ["tls"]

[[example]]
name = "e2e_benchmark"
required-features = ["testing"]

[dev-dependencies]
chrono.workspace = true
tokio.workspace = true
criterion.workspace = true
vyna-hl7-transform = { workspace = true, features = ["serde"] }
vyna-hl7-templates.workspace = true
vyna-hl7-fhir.workspace = true

[[bench]]
name = "pipeline_bench"
harness = false

[[bench]]
name = "transport_bench"
harness = false
required-features = ["testing"]

[workspace]
members = [
    "crates/vyna-hl7-core",
    "crates/vyna-hl7-parser",
    "crates/vyna-hl7-validator",
    "crates/vyna-hl7-terser",
    "crates/vyna-hl7-transform",
    "crates/vyna-hl7-templates",
    "crates/vyna-hl7-mllp",
    "crates/vyna-hl7-http",
    "crates/vyna-hl7-macros",
    "crates/vyna-hl7-codegen",
    "crates/vyna-hl7-redact",
    "crates/vyna-hl7-convert",
    "crates/vyna-hl7-queue",
    "crates/vyna-hl7-batch",
    "crates/vyna-hl7-fhir",
    "crates/vyna-hl7-custom",
    "crates/vyna-hl7-conformance",
    "crates/vyna-hl7-orchestration",
    "crates/vyna-hl7-wasm",
    "crates/vyna-hl7-cli",
    "crates/vyna-hl7-xml",
    "crates/vyna-hl7-testpanel",
]
resolver = "2"

[workspace.package]
version = "0.11.2"
edition = "2024"
rust-version = "1.99"
authors = ["Alex SHAO Fan"]
license = "MIT"
repository = "https://github.com/FlostelInfoTech/vynahl7"
homepage = "https://github.com/FlostelInfoTech/vynahl7"
keywords = ["hl7", "healthcare", "medical", "interoperability"]
categories = ["parsing", "network-programming", "data-structures"]

[workspace.dependencies]
# Async runtime for MLLP
tokio = { version = "1.48", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Serialization for specs
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "2.0"

# Regex
regex = "1.12"

# Date/Time handling
chrono = "0.4"

# Hashing (de-identification)
hmac = "0.13"
sha2 = "0.11"

# WebAssembly
wasm-bindgen = "0.2"

# Testing
proptest = "1.9"

# Benchmarking (criterion only; benches declare no extra features)
criterion = "0.8"

# CLI argument parsing
clap = { version = "4.5", features = ["derive", "cargo"] }

# HTTP framework (vyna-hl7-http; tower/hyper stay crate-local)
axum = "0.8"

# HTTP client (members add features: testpanel adds "rustls")
reqwest = { version = "0.13", features = ["json"] }

# TLS stack (shared by MLLP and HTTP; members keep `optional = true`)
rustls = "0.23"
tokio-rustls = "0.26"
webpki-roots = "1.0"

# GUI test panel (eframe/egui/egui_extras move in lockstep)
eframe = "0.36"
egui = "0.36"
egui_extras = { version = "0.36", features = ["syntect"] }

# Shared utilities
rand = "0.10"
uuid = { version = "1.19", features = ["v4"] }
base64 = "0.23"
futures = "0.3"
tracing-subscriber = "0.3"
libunftp = "0.23"
unftp-sbe-fs = "0.4"

# Procedural macros
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0", features = ["full"] }

# Character set conversion for MSH-18 (HL7 table 0211)
encoding_rs = "0.8"

# Synchronization
once_cell = "1.21"

# Macro utilities
paste = "1.0"

# Internal crates
vyna-hl7-core = { version = "0.11.2", path = "crates/vyna-hl7-core" }
vyna-hl7-parser = { version = "0.11.2", path = "crates/vyna-hl7-parser" }
vyna-hl7-validator = { version = "0.11.2", path = "crates/vyna-hl7-validator" }
vyna-hl7-terser = { version = "0.11.2", path = "crates/vyna-hl7-terser" }
vyna-hl7-transform = { version = "0.11.2", path = "crates/vyna-hl7-transform" }
vyna-hl7-templates = { version = "0.11.2", path = "crates/vyna-hl7-templates" }
vyna-hl7-mllp = { version = "0.11.2", path = "crates/vyna-hl7-mllp" }
vyna-hl7-http = { version = "0.11.2", path = "crates/vyna-hl7-http" }
vyna-hl7-fhir = { version = "0.11.2", path = "crates/vyna-hl7-fhir" }
vyna-hl7-custom = { version = "0.11.2", path = "crates/vyna-hl7-custom" }
vyna-hl7-conformance = { version = "0.11.2", path = "crates/vyna-hl7-conformance" }
vyna-hl7-macros = { version = "0.11.2", path = "crates/vyna-hl7-macros" }
vyna-hl7-codegen = { version = "0.11.2", path = "crates/vyna-hl7-codegen" }
vyna-hl7-redact = { version = "0.11.2", path = "crates/vyna-hl7-redact" }
vyna-hl7-convert = { version = "0.11.2", path = "crates/vyna-hl7-convert" }
vyna-hl7-queue = { version = "0.11.2", path = "crates/vyna-hl7-queue" }
vyna-hl7-batch = { version = "0.11.2", path = "crates/vyna-hl7-batch" }
vyna-hl7-xml = { version = "0.11.2", path = "crates/vyna-hl7-xml" }

# XML
quick-xml = "0.42"

# File transfer (batch exchange)
suppaftp = { version = "12", features = ["tokio"] }
russh = { version = "0.64" }
russh-sftp = { version = "3" }

[workspace.lints.rust]
# `deny` (not `forbid`) so the one legitimate use — the counting
# GlobalAlloc in the parser alloc-profile bench — can allow it back
# with a local justification.
unsafe_code = "deny"

[workspace.lints.clippy]
# Match the CI contract (`cargo clippy -- -D warnings`).
all = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[lints]
workspace = true
