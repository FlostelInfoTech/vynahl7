# AL1 allergy list entry -> FHIR AllergyIntolerance.
# Mirrors AllergyIntoleranceConverter for a single repetition: exact JSON
# parity is asserted in mapping.rs tests.
resourceType: AllergyIntolerance
fields:
  - target: clinicalStatus.coding[0].system
    constant: "http://terminology.hl7.org/CodeSystem/allergyintolerance-clinical"
  - target: clinicalStatus.coding[0].code
    constant: active
  - target: clinicalStatus.coding[0].display
    constant: Active
  - target: category[0]
    source: AL1-2
    map: {DA: medication, FA: food, MA: environment, EA: environment}
    default: environment
  - target: code.coding[0].code
    source: AL1-3
  - target: code.coding[0].display
    source: AL1-3-2
    when: AL1-3
  - target: code.coding[0].system
    source: AL1-3-3
    when: AL1-3
    map:
      CVX: http://hl7.org/fhir/sid/cvx
      NDC: http://hl7.org/fhir/sid/ndc
      MVX: http://hl7.org/fhir/sid/mvx
      RXNORM: http://www.nlm.nih.gov/research/umls/rxnorm
      LN: http://loinc.org
      LNC: http://loinc.org
      SNM: http://snomed.info/sct
      SCT: http://snomed.info/sct
      ICD9: http://hl7.org/fhir/sid/icd-9-cm
      ICD10: http://hl7.org/fhir/sid/icd-10
      CPT: http://www.ama-assn.org/go/cpt
      I9: http://hl7.org/fhir/sid/icd-9-cm
      I9C: http://hl7.org/fhir/sid/icd-9-cm
      I10: http://hl7.org/fhir/sid/icd-10
      I10P: http://hl7.org/fhir/sid/icd-10-pcs
      C4: http://www.ama-assn.org/go/cpt
    default: "urn:oid:{value}"
  - target: code.text
    source: AL1-3-2
    fallback_source: AL1-3
  - target: patient.reference
    source: PID-3
    template: "Patient/{value}"
  - target: patient.type
    constant: Patient
  - target: criticality
    source: AL1-4
    map: {MI: low, MO: low, SV: high}
    default: unable-to-assess
