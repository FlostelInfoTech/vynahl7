[package]
name = "vyna-hl7-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "HTTP transport for HL7 v2.x messages (inter-organization communication)"

[dependencies]
vyna-hl7-core.workspace = true
vyna-hl7-parser.workspace = true
tokio.workspace = true
thiserror.workspace = true
anyhow.workspace = true

# HTTP framework (latest versions - December 2025)
axum.workspace = true
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors", "compression-gzip"] }
hyper = { version = "1.8", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1", "http2"] }

# HTTP client
reqwest.workspace = true

# Date/time for RFC 2822 dates
chrono.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Security - TLS/mTLS (optional)
tokio-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }

# Security - Authentication (optional)
base64 = { workspace = true, optional = true }
jsonwebtoken = { version = "11", features = ["rust_crypto"], optional = true }

# Protocol - WebSocket (optional)
tokio-tungstenite = { version = "0.30", optional = true }
futures-util = { version = "0.3", optional = true }

# Protocol - Retry (optional)
# Note: retry uses the hand-rolled executor in retry.rs (backed by rand);
# no reqwest middleware crates are involved.
rand = { workspace = true, optional = true }

# Operational - Logging (optional)
tracing = "0.1"
tracing-subscriber = { workspace = true, features = ["env-filter", "json"], optional = true }
uuid = { workspace = true, optional = true }
vyna-hl7-terser = { workspace = true, optional = true }

# Operational - Metrics (optional)
metrics = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.18", optional = true }

# Operational - Rate Limiting (optional)
# Note: Rate limiting is provided as configuration helpers only.
# Users should integrate with governor crate directly.

# Messaging - Queue (optional)
async-channel = { version = "2.3", optional = true }

[features]
default = []

# Security features
tls = ["dep:tokio-rustls", "dep:rustls", "dep:webpki-roots", "reqwest/rustls"]
auth = ["dep:base64"]
oauth = ["auth", "dep:jsonwebtoken"]

# Protocol features
websocket = ["axum/ws", "dep:tokio-tungstenite", "dep:futures-util"]
retry = ["dep:rand"]

# Operational features
logging = ["dep:tracing-subscriber", "dep:uuid", "dep:vyna-hl7-terser"]
metrics = ["dep:metrics", "dep:metrics-exporter-prometheus", "dep:vyna-hl7-terser"]
ratelimit = []
compression = ["tower-http/compression-gzip", "tower-http/compression-br", "tower-http/decompression-gzip", "tower-http/decompression-br"]

# Messaging features
queue = ["dep:async-channel"]
batch = []
routing = ["dep:vyna-hl7-terser"]
webhooks = ["dep:vyna-hl7-terser"]

# Testing features
testing = []

# Meta feature - enable all features
full = ["tls", "auth", "oauth", "websocket", "retry", "logging", "metrics", "ratelimit", "compression", "queue", "batch", "routing", "webhooks", "testing"]

[dev-dependencies]
tokio-test = "0.4"
tracing-subscriber.workspace = true
vyna-hl7-terser.workspace = true
# Dual-provider test builds (see tls.rs): `ring` alongside the default
# `aws-lc-rs`, reproducing downstream builds that enable both — the
# configuration under which inferred providers panic.
rustls = { workspace = true, features = ["ring"] }

[lints]
workspace = true
