<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img">
  <title>VynaHL7</title>
  <desc>VynaHL7 mark — V chevron with HL7 field-separator bars. Base uses currentColor, accents fixed teal. Works in light and dark mode.</desc>
  <!-- V chevron -->
  <path d="M12 18 L26 46 L40 18"
        fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Field-separator bars -->
  <rect x="46.5" y="22" width="3.5" height="22" rx="1.75" fill="#00B8C4"/>
  <rect x="51.5" y="27" width="3.5" height="17" rx="1.75" fill="#00B8C4" opacity="0.75"/>
  <rect x="56.5" y="32" width="3.5" height="12" rx="1.75" fill="#00B8C4" opacity="0.5"/>
</svg>
