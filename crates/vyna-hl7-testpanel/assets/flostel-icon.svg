<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img">
  <title>FLOSTEL INFOTECH</title>
  <desc>Abstract AI core mark — hexagon structure, neural traces, spark core. Base uses currentColor, accents fixed cyan. Works in light and dark mode.</desc>
  <defs>
    <linearGradient id="flostelCore" x1="23" y1="23" x2="41" y2="41" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC53D"/>
      <stop offset="1" stop-color="#FF8A00"/>
    </linearGradient>
  </defs>
  <!-- Artwork scaled 1.2x about center to fill canvas -->
  <g transform="translate(32 32) scale(1.2) translate(-32 -32)">
  <!-- Hexagon structure -->
  <polygon points="54,32 43,51 21,51 10,32 21,13 43,13"
           fill="none" stroke="currentColor" stroke-width="5.5" stroke-linejoin="round"/>
  <!-- Neural traces (core to satellites) -->
  <path d="M32 32 L32 23" stroke="#00D4FF" stroke-width="2.6" stroke-linecap="round" opacity="0.9"/>
  <path d="M32 32 L24.5 36.5" stroke="#00D4FF" stroke-width="2.6" stroke-linecap="round" opacity="0.9"/>
  <path d="M32 32 L39.5 36.5" stroke="#0096FF" stroke-width="2.6" stroke-linecap="round" opacity="0.9"/>
  <!-- Satellite nodes -->
  <circle cx="32" cy="21.5" r="3.1" fill="currentColor"/>
  <circle cx="24" cy="37" r="3.1" fill="currentColor"/>
  <circle cx="40" cy="37" r="3.1" fill="currentColor"/>
  <!-- AI spark core -->
  <path d="M32 23.5 C33.3 27.8 36.2 30.7 40.5 32 C36.2 33.3 33.3 36.2 32 40.5 C30.7 36.2 27.8 33.3 23.5 32 C27.8 30.7 30.7 27.8 32 23.5 Z"
        fill="url(#flostelCore)"/>
  </g>
</svg>
