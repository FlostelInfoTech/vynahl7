[package]
name = "vyna-hl7-testpanel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "GUI Test Panel for VynaHL7 HL7 Library - demonstrates parsing, building, validation, MLLP, and FHIR conversion"
keywords = ["hl7", "healthcare", "gui", "test-panel"]
categories = ["gui", "development-tools::testing"]

[dependencies]
# GUI framework
eframe = "0.36"
egui = "0.36"
egui_extras = { version = "0.36", features = ["syntect"] }

# VynaHL7 crates
vyna-hl7-core.workspace = true
vyna-hl7-parser.workspace = true
vyna-hl7-terser.workspace = true
vyna-hl7-validator.workspace = true
vyna-hl7-fhir.workspace = true
vyna-hl7-mllp.workspace = true
vyna-hl7-http = { workspace = true, features = ["auth"] }
vyna-hl7-xml.workspace = true
vyna-hl7-templates.workspace = true

# Async runtime for MLLP/HTTP/FTP
tokio = { version = "1.48", features = [
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
    "net",
    "io-util",
] }

# FTP Client/Server support
suppaftp.workspace = true
libunftp = "0.23"  # Must match unftp-sbe-fs dependency
unftp-sbe-fs = "0.4"
unftp-core = "0.1"  # Auth traits for the libunftp test server

# SFTP Client/Server support (via SSH)
ssh2 = "0.9"  # For SFTP client (sync, wrapped with spawn_blocking)
russh.workspace = true  # For SFTP server (async)
async-trait = "0.1"
futures = "0.3"
glob = "0.3"  # For file pattern matching
rand = "0.10"  # For key generation (OsRng for russh server keys)

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

# File dialogs
rfd = "0.17"

# HTTP client with TLS support
reqwest = { version = "0.13", features = ["rustls", "json"] }

# Utilities
chrono.workspace = true
uuid = { version = "1.19", features = ["v4"] }
env_logger = "0.11"
log = "0.4"
once_cell.workspace = true
base64 = "0.23"

# SVG rendering for logo
resvg = "0.48"
usvg = "0.48"
tiny-skia = "0.12"

[build-dependencies]
resvg = "0.48"
usvg = "0.48"
tiny-skia = "0.12"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
default = []

[[bin]]
name = "vyna-hl7-testpanel"
path = "src/main.rs"
