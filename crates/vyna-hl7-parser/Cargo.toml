[package]
name = "vyna-hl7-parser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "Parser for HL7 v2.x messages"
# Helper modules (alloc_counter, bench_env, corpus) are `mod`-included by
# the declared benches below; without this they would also build as
# broken standalone bench targets.
autobenches = false

[dependencies]
vyna-hl7-core.workspace = true
thiserror.workspace = true
chrono.workspace = true

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "parser_bench"
harness = false

[[bench]]
name = "industry_bench"
harness = false

[[bench]]
name = "message_types_bench"
harness = false

[[bench]]
name = "edge_cases_bench"
harness = false

[[bench]]
name = "alloc_profile_bench"
harness = false

[[bench]]
name = "env_report_bench"
harness = false

[lints]
workspace = true
