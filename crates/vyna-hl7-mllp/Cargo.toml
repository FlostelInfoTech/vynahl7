[package]
name = "vyna-hl7-mllp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/vyna-hl7-mllp"
keywords.workspace = true
categories.workspace = true
description = "MLLP (Minimal Lower Layer Protocol) support for HL7 message transmission"

[dependencies]
vyna-hl7-core.workspace = true
vyna-hl7-parser.workspace = true
tokio.workspace = true
tokio-util.workspace = true
bytes.workspace = true
thiserror.workspace = true
anyhow.workspace = true

# Security - TLS/mTLS (optional)
tokio-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }

[features]
default = []

# Security features
tls = ["dep:tokio-rustls", "dep:rustls", "dep:webpki-roots"]

# Testing features
testing = []

# Meta feature - enable all features
full = ["tls", "testing"]

[dev-dependencies]
uuid.workspace = true
futures.workspace = true
# Dual-provider test builds (see tls.rs): `ring` alongside the default
# `aws-lc-rs`, reproducing downstream builds that enable both — the
# configuration under which inferred providers panic.
rustls = { workspace = true, features = ["ring"] }

[lints]
workspace = true
