name: Fuzz

# Nightly-only libFuzzer runs over the parser. Weekly schedule plus
# manual dispatch only: too slow and toolchain-heavy for per-PR CI.
# Targets live in fuzz/fuzz_targets/; seeds in fuzz/corpus/.
on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz parse
        working-directory: fuzz
        run: cargo fuzz run parse -- -max_total_time=600
      - name: Fuzz roundtrip
        working-directory: fuzz
        run: cargo fuzz run roundtrip -- -max_total_time=600
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
