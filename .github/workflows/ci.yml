name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test (default features)
        run: cargo test --workspace
      - name: Test (HTTP TLS + auth)
        run: cargo test -p vyna-hl7-http --features tls,testing,auth
      - name: Test (MLLP TLS integration)
        run: cargo test -p vyna-hl7-mllp --features tls,testing --test tls_integration
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: WASM target check
        run: cargo build -p vyna-hl7-wasm --target wasm32-unknown-unknown

  # Browser suite for vyna-hl7-wasm: the #[cfg(target_arch = "wasm32")]
  # wasm_bindgen_test bodies are not even compiled by `cargo test`, so
  # they need the wasm-pack headless-firefox runner documented in the
  # wasm README's Run Tests section.
  wasm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: cargo install wasm-pack
      - uses: browser-actions/setup-firefox@latest
      - uses: browser-actions/setup-geckodriver@latest
      - name: WASM browser tests
        working-directory: crates/vyna-hl7-wasm
        run: wasm-pack test --headless --firefox

  # Optional features the default build never exercises: targeted combos
  # only (one row per shipped feature plus combined rows), not a powerset.
  feature-combos:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: vyna-hl7-cli
            features: fhir
          - package: vyna-hl7-cli
            features: tls
          - package: vyna-hl7-cli
            features: fhir,tls
          - package: vyna-hl7-http
            features: compression
          - package: vyna-hl7-http
            features: oauth
          - package: vyna-hl7-http
            features: websocket
          - package: vyna-hl7-http
            features: compression,oauth,websocket
          - package: vyna-hl7-http
            features: retry
          - package: vyna-hl7-http
            features: logging
          - package: vyna-hl7-http
            features: metrics
          - package: vyna-hl7-http
            features: ratelimit
          - package: vyna-hl7-http
            features: queue
          - package: vyna-hl7-http
            features: batch
          - package: vyna-hl7-http
            features: routing
          - package: vyna-hl7-http
            features: webhooks
          - package: vyna-hl7-http
            features: full
          - package: vyna-hl7-mllp
            features: full
          - package: vyna-hl7-batch
            features: ftp,sftp,testing
          - package: vyna-hl7-core
            features: serde
          - package: vyna-hl7-transform
            features: serde
          - package: vyna-hl7-xml
            features: convert
          - package: vyna-hl7-wasm
            features: console_error_panic_hook
          - package: vyna-hl7
            features: tls
          - package: vyna-hl7
            features: testing
          - package: vyna-hl7
            features: tls,testing
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build ${{ matrix.package }} (${{ matrix.features }})
        run: cargo build -p ${{ matrix.package }} --features ${{ matrix.features }}
      - name: Test ${{ matrix.package }} (${{ matrix.features }})
        run: cargo test -p ${{ matrix.package }} --features ${{ matrix.features }}

  fmt:
    runs-on: ubuntu-latest
    # Advisory only until the repo-wide rustfmt normalization lands
    # (large pre-existing baseline drift); then remove continue-on-error.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check --edition 2024
